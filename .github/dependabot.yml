# Dependabot — SÓ correções de segurança.
#
# Os alertas e as "Dependabot security updates" estão ligados nas configurações
# do repositório e continuam abrindo PR quando uma dependência tem CVE.
# As atualizações de VERSÃO de rotina estão desligadas (limite 0) de propósito:
# no primeiro dia elas abriram 16 PRs de uma vez, várias de major que mexem em
# decisão travada (sentence-transformers 6 = embedding, websockets 17, RealtimeSTT 1,
# TypeScript 7). Upgrade de versão neste projeto passa pelo stack-compatibility-guard,
# não por PR automática — ver as decisões travadas no CLAUDE.md.
# Pra reativar um ecossistema, troque o limite por um número > 0.

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
