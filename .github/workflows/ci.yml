name: CI

# Qualidade: lint (ruff) + testes (pytest) no backend; next build no frontend.
# Roda em windows-latest porque o ambiente REAL do VoxDM é Windows (GPU + áudio
# diretos, sem Docker — ver CLAUDE.md). Testar no SO de produção evita os
# problemas-fantasma do Ubuntu (PEP-668, portaudio.h, torch-CUDA) que não
# existem aqui. Offline — conftest mocka I/O externa e seta VOXDM_SKIP_WARMUP.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antigos do mesmo branch/PR quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff + pytest (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      - name: Lint (ruff)
        # Lint nao bloqueia o merge por ora (so reporta) — restam erros B904/F401
        # a triar. Quando zerados, remover o `|| true` pra virar bloqueante.
        # shell: bash explicito — no Windows o default e PowerShell, onde `|| true`
        # nao funciona. Git Bash vem instalado no windows-latest.
        shell: bash
        run: uvx ruff check . || true

      - name: Criar venv
        run: uv venv

      - name: Instalar deps
        # No Windows: torch default ja e CPU (sem index especial), pyaudio tem
        # wheel pronto (sem build/portaudio), e venv evita PEP-668. Simples.
        run: uv pip install -r requirements.txt

      - name: Testes (pytest)
        env:
          VOXDM_SKIP_WARMUP: "1"
        run: uv run pytest tests/ -q

  frontend:
    name: Frontend — build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar deps
        working-directory: frontend
        run: npm ci

      - name: Build (tsc + lint + compile)
        # next build inclui tsc + ESLint + compilacao. Pega rules-of-hooks que
        # o `tsc --noEmit` sozinho NAO pega (foi o debito que quebrou producao
        # sem ninguem ver — ver memory/debito_next_build_lint.md). Agora bloqueia.
        working-directory: frontend
        run: npm run build
