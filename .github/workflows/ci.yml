name: CI

# Qualidade: lint (ruff) + testes (pytest) no backend; next build (tsc+lint+compile) no frontend.
# Roda offline — conftest mocka todas as I/O externas e seta VOXDM_SKIP_WARMUP.
# NAO precisa de GPU nem de secrets reais.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antigos do mesmo branch/PR quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Libs de sistema (build de wheels nativas)
        # pyaudio (transitivo de RealtimeSTT) compila contra portaudio.h, ausente
        # no runner. Sem GPU/microfone o pacote nao roda nada nos testes, mas
        # precisa BUILDAR pra instalar. portaudio19-dev fornece o header.
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      - name: Lint (ruff)
        # Lint nao bloqueia o merge por ora (so reporta) — restam erros B904/F401
        # a triar. Quando zerados, remover o `|| true` pra virar bloqueante.
        run: uvx ruff check . || true

      - name: Criar venv
        run: uv venv

      - name: Instalar torch CPU
        # Stack ML (sentence-transformers/RealtimeSTT/kokoro) exige torch. No
        # Linux o default seria a build CUDA (~2.5GB, inviavel no runner) — entao
        # forcamos a build CPU pelo index oficial do PyTorch. Os testes nao usam
        # GPU (VOXDM_SKIP_WARMUP + nenhum teste instancia STT/embedder real).
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar deps
        # torch ja satisfeito pelo passo anterior; o resto vem do requirements.
        run: uv pip install -r requirements.txt

      - name: Testes (pytest)
        env:
          VOXDM_SKIP_WARMUP: "1"
        run: uv run pytest tests/ -q

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar deps
        working-directory: frontend
        run: npm ci

      - name: Build (tsc + lint + compile)
        # next build inclui tsc + ESLint + compilacao. Pega rules-of-hooks que
        # o `tsc --noEmit` sozinho NAO pega (foi o debito que quebrou producao
        # sem ninguem ver — ver memory/debito_next_build_lint.md). Agora bloqueia.
        working-directory: frontend
        run: npm run build
