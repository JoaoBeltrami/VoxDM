name: CI

# Qualidade: lint (ruff) + testes (pytest) + type-check do frontend (tsc).
# Roda offline — conftest mocka todas as I/O externas e seta VOXDM_SKIP_WARMUP.
# NAO precisa de GPU nem de secrets reais.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antigos do mesmo branch/PR quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      - name: Lint (ruff)
        # Lint nao bloqueia o merge por ora (so reporta) — o codebase tem ~39
        # F401 de re-export legitimo. Quando zerarmos os avisos, trocar para
        # bloqueante removendo o `|| true`.
        run: uvx ruff check . || true

      - name: Instalar deps
        run: uv pip install --system -r requirements.txt

      - name: Testes (pytest)
        env:
          # Valores fake — conftest ja faz setdefault, mas reforcamos aqui.
          VOXDM_SKIP_WARMUP: "1"
        run: uv run --no-project pytest tests/ -q

  frontend:
    name: Frontend — tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar deps
        working-directory: frontend
        run: npm ci

      - name: Type-check (tsc)
        working-directory: frontend
        run: npx tsc --noEmit
